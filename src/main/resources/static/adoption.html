<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adopt a Pet - Pets Care Hospital</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background-color: #fff7ed;
            background-image: radial-gradient(#fdba74 1.5px, transparent 1.5px);
            background-size: 35px 35px;
            min-height: 100vh;
            position: relative;
            z-index: 0;
        }
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 300px;
            background: #ffedd5;
            clip-path: ellipse(120% 100% at 50% 0%);
            z-index: -1;
        }
        .logo, nav a, .dashboard-container h2, h2 {
            color: #9a3412 !important;
        }

        .pet-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem;
            padding: 2rem 0;
        }

        .pet-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            transition: transform 0.2s;
        }

        .pet-card:hover {
            transform: translateY(-5px);
        }

        .pet-image {
            width: 100%;
            height: 250px;
            object-fit: cover;
            background: #f1f5f9;
        }

        .pet-content {
            padding: 1.5rem;
        }

        .pet-tag {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            background: var(--primary-light);
            color: var(--primary);
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
        }

        .pet-name {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
        }

        .pet-desc {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-bottom: 1.5rem;
            line-height: 1.5;
        }
    </style>
</head>

<body>
    <header>
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <div class="logo"><i class="fa-solid fa-hospital"></i> Pets Care Hospital</div>
            <nav>
                <ul>
                    <li><a href="/">Home</a></li>
                    <li><a href="/shop.html">Shop</a></li>
                    <li><a href="/adoption.html" class="active">Adoption</a></li>
                    <li><a href="/track.html">Track Status</a></li>
                    <li><button onclick="window.location.href='/'" class="btn-login">Login</button></li>
                </ul>
            </nav>
        </div>
    </header>

    <div class="dashboard-container" style="max-width: 1200px; margin: 0 auto; padding: 2rem;">
        <div class="text-center mb-4">
            <h1 style="font-size: 2.5rem; color: var(--text-primary); margin-bottom: 1rem;">Find Your New Best Friend
            </h1>
            <p style="color: var(--text-secondary); max-width: 600px; margin: 0 auto;">
                Give a loving home to a pet in need. Browse our available pets below and submit an adoption request
                today.
            </p>
        </div>

        <div id="petGrid" class="pet-grid">
            <!-- Pets will be loaded here -->
            <div class="text-center" style="grid-column: 1/-1; padding: 3rem;">
                <i class="fa-solid fa-spinner fa-spin" style="font-size: 2rem; color: var(--primary);"></i>
                <p class="mt-2">Loading available pets...</p>
            </div>
        </div>
    </div>

    <!-- Adoption Request Modal -->
    <div id="adoptModal" class="modal">
        <div class="login-box" style="max-width: 500px;">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            <h2 class="mb-2">Adopt <span id="modalPetName"></span></h2>
            <p class="text-muted mb-3">Please fill out this form to request adoption.</p>

            <form onsubmit="submitAdoption(event)">
                <input type="hidden" id="modalPetId" name="petId">

                <div class="form-group">
                    <label>Your Name</label>
                    <input type="text" name="name" required placeholder="Full Name">
                </div>

                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" name="phone" required placeholder="01XXXXXXXXX">
                </div>

                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" name="email" required placeholder="example@email.com">
                </div>

                <div class="form-group">
                    <label>Why do you want to adopt?</label>
                    <textarea name="reason" rows="3" required
                        placeholder="Tell us about your home and experience with pets..."></textarea>
                </div>

                <button type="submit" class="btn-primary" style="width:100%">Submit Request</button>
            </form>
        </div>
    </div>

    <script>
        // Load pets on page load
        loadPets();

        function loadPets() {
            fetch('/api/adoption/list')
                .then(res => res.json())
                .then(data => {
                    const grid = document.getElementById('petGrid');

                    if (data.length === 0) {
                        grid.innerHTML = `
                            <div class="text-center" style="grid-column: 1/-1; padding: 3rem; background: white; border-radius: 12px;">
                                <i class="fa-solid fa-paw" style="font-size: 3rem; color: #cbd5e1; margin-bottom: 1rem;"></i>
                                <h3>No pets available right now</h3>
                                <p class="text-muted">Please check back later!</p>
                            </div>
                        `;
                        return;
                    }

                    // Render pets using the direct image field
                    grid.innerHTML = data.map(pet => `
                        <div class="pet-card">
                            <div class="pet-image" style="display:flex; align-items:center; justify-content:center; background:#f8fafc; overflow:hidden;">
                                ${pet.image ?
                            `<img src="${pet.image}" alt="${pet.name}" style="width:100%; height:100%; object-fit:cover;">` :
                            `<i class="fa-solid fa-paw" style="font-size: 3rem; color: #cbd5e1;"></i>`
                        }
                            </div>
                            <div class="pet-content">
                                <span class="pet-tag">${pet.category}</span>
                                <h3 class="pet-name">${pet.name}</h3>
                                <p class="pet-desc">${pet.desc || pet.description || 'No description available.'}</p>
                                <button onclick="openAdoptModal(${pet.id}, '${pet.name.replace(/'/g, "\\\\'")}')" class="btn-primary" style="width:100%">
                                    <i class="fa-solid fa-heart"></i> Adopt Me
                                </button>
                            </div>
                        </div>
                    `).join('');
                })
                .catch(err => {
                    console.error(err);
                    document.getElementById('petGrid').innerHTML = `
                        <div class="text-center" style="grid-column: 1/-1; color: var(--danger);">
                            <p>Failed to load pets. Please try again later.</p>
                        </div>
                    `;
                });
        }

        function openAdoptModal(id, name) {
            document.getElementById('modalPetId').value = id;
            document.getElementById('modalPetName').textContent = name;
            document.getElementById('adoptModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('adoptModal').classList.remove('active');
        }

        function submitAdoption(e) {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());

            const btn = e.target.querySelector('button[type="submit"]');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Submitting...';
            btn.disabled = true;

            fetch('/api/adoption/request', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            })
                .then(res => res.json())
                .then(res => {
                    if (res.success) {
                        alert('Adoption request submitted successfully! We will contact you soon.');
                        closeModal();
                        e.target.reset();
                    } else {
                        alert('Error: ' + (res.message || 'Unknown error'));
                    }
                })
                .catch(err => {
                    console.error(err);
                    alert('Failed to submit request.');
                })
                .finally(() => {
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                });
        }

        // Close modal when clicking outside
        window.onclick = function (event) {
            const modal = document.getElementById('adoptModal');
            if (event.target == modal) {
                closeModal();
            }
        }
    </script>
</body>

</html>
