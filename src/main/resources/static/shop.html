<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop - Pets Care</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background-color: #f8fafc;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
            z-index: 0;
        }
        body::before, body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            z-index: -1;
        }
        body::before {
            width: 400px; height: 400px;
            background: rgba(56, 189, 248, 0.3);
            top: -100px; left: -100px;
        }
        body::after {
            width: 500px; height: 500px;
            background: rgba(167, 139, 250, 0.3);
            bottom: -150px; right: -100px;
        }
        
        .logo, nav a, .page-title, .dashboard-container h2 {
            color: #0f172a !important;
            text-shadow: none;
        }

        .product-card {
            background: white;
            border-radius: 1rem;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        .product-image {
            height: 220px;
            width: 100%;
            object-fit: cover;
            background: #f3f4f6;
        }

        .product-content {
            padding: 1.5rem;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .product-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }

        .product-category {
            font-size: 0.875rem;
            color: var(--text-muted);
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .product-footer {
            margin-top: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }

        .product-price {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
        }

        .btn-cart {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-cart:hover {
            background: var(--primary-dark);
        }
    </style>
</head>

<body>
    <header>
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <div class="logo"><i class="fa-solid fa-bag-shopping"></i> Pets Care Shop</div>
            <nav>
                <ul>
                    <li><a href="/">Home</a></li>
                    <li><a href="/shop.html" style="color:var(--primary);">Shop</a></li>
                    <li><a href="#" onclick="showAdoption()" id="adoptLink">Adoption</a></li>
                    <li><a href="/cart.html">Cart <span id="cartCount" class="badge badge-info">0</span></a></li>
                </ul>
            </nav>
        </div>
    </header>

    <div class="dashboard-container">
        <!-- Shop Section -->
        <div id="shopSection">
            <div class="header-bar">
                <h1 class="page-title">Premium Pet Products</h1>
                <div class="form-group" style="margin:0; width:200px;">
                    <select onchange="filterProducts(this.value)">
                        <option value="all">All Categories</option>
                        <option value="Food">Food</option>
                        <option value="Medicine">Medicine</option>
                        <option value="Accessories">Accessories</option>
                    </select>
                </div>
            </div>

            <div class="services" id="productGrid" style="padding:0;">
                <!-- Products go here -->
            </div>
        </div>

        <!-- Adoption Section -->
        <div id="adoptionSection" style="display:none;">
            <div class="header-bar">
                <h1 class="page-title">Find Your New Best Friend <i class="fa-solid fa-paw"></i></h1>
            </div>
            <div class="services" id="adoptionGrid" style="padding:0;">
                <!-- Adoption pets go here -->
            </div>
        </div>
    </div>

    <!-- Adoption Application Modal -->
    <div id="adoptionModal" class="modal">
        <div class="login-box">
            <span class="close-modal" onclick="closeAdoptionModal()">&times;</span>
            <h2 class="mb-2">Adopt a Pet</h2>
            <p class="text-muted mb-3" id="adoptPetName"></p>
            <form onsubmit="submitAdoption(event)">
                <input type="hidden" name="petId" id="adoptPetId">
                <div class="form-group">
                    <label>Your Name</label>
                    <input type="text" name="name" required>
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" name="phone" required>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" name="email" required>
                </div>
                <div class="form-group">
                    <label>Why do you want to adopt?</label>
                    <textarea name="reason" rows="3" required
                        placeholder="Tell us about your home and experience with pets..."></textarea>
                </div>
                <button type="submit" class="btn-primary" style="width:100%">Submit Application</button>
            </form>
        </div>

        <!-- Login Check Modal -->
        <div id="loginCheckModal" class="modal">
            <div class="login-box text-center">
                <span class="close-modal" onclick="closeCheckModal()">&times;</span>
                <div style="font-size:3rem; margin-bottom:1rem; color:var(--primary);"><i class="fa-solid fa-lock"></i>
                </div>
                <h2 class="mb-2">Login Required</h2>
                <p class="text-muted mb-3">Please login to add items to your cart.</p>
                <button onclick="window.location.href='/'" class="btn-primary" style="width:100%">Go to Login</button>
            </div>
        </div>

        <script>
            let allProducts = [];

            // Initial Load
            loadProducts();
            updateCartCount();

            function loadProducts() {
                fetch('/api/shop/products')
                    .then(res => res.json())
                    .then(data => {
                        allProducts = data;
                        renderProducts(data);
                    });
            }

            function renderProducts(products) {
                const grid = document.getElementById('productGrid');
                grid.innerHTML = products.map(p => `
                <div class="product-card">
                    <div style="position: relative; overflow: hidden; height: 220px;">
                        ${p.imageBase64 || p.image ? `<img src="${p.imageBase64 || p.image}" class="product-image" onerror="this.src='https://via.placeholder.com/300x220?text=No+Image'">` : '<div class="product-image" style="display:flex;align-items:center;justify-content:center;"><i class="fa-solid fa-box-open" style="font-size:3rem;color:var(--text-muted);"></i></div>'}
                        <div class="product-overlay" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.05); opacity: 0; transition: opacity 0.3s;"></div>
                    </div>
                    <div class="product-content">
                        <div class="product-category">${p.category}</div>
                        <h3 class="product-title">${p.name}</h3>
                        <div class="product-footer">
                            <div class="product-price">৳${p.price}</div>
                            <button onclick="addToCart(${p.id}, '${p.name.replace(/'/g, "\\'")}', ${p.price}, '${p.imageBase64 || p.image ? (p.imageBase64 || p.image) : ''}')" class="btn-cart">
                                <i class="fa-solid fa-cart-plus"></i> Add
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
            }

            function filterProducts(category) {
                if (category === 'all') renderProducts(allProducts);
                else renderProducts(allProducts.filter(p => p.category === category));
            }

            function addToCart(id, name, price, image) {
                let cart = JSON.parse(localStorage.getItem('cart')) || [];
                const existing = cart.find(item => item.id === id);

                if (existing) {
                    existing.quantity += 1;
                } else {
                    cart.push({ id, name, price, image, quantity: 1 });
                }

                localStorage.setItem('cart', JSON.stringify(cart));
                updateCartCount();

                // Show a toast or small notification instead of alert
                const toast = document.createElement('div');
                toast.textContent = 'Added to cart!';
                toast.style.cssText = 'position: fixed; bottom: 20px; right: 20px; background: var(--success); color: white; padding: 10px 20px; border-radius: 5px; z-index: 1000; animation: fadeIn 0.3s;';
                document.body.appendChild(toast);
                setTimeout(() => {
                    toast.style.animation = 'fadeOut 0.3s';
                    setTimeout(() => toast.remove(), 300);
                }, 2000);
            }

            function updateCartCount() {
                const cart = JSON.parse(localStorage.getItem('cart')) || [];
                const count = cart.reduce((sum, item) => sum + item.quantity, 0);
                document.getElementById('cartCount').textContent = count;
            }

            function closeCheckModal() {
                document.getElementById('loginCheckModal').classList.remove('active');
            }

            // Adoption Logic
            function showAdoption() {
                document.getElementById('shopSection').style.display = 'none';
                document.getElementById('adoptionSection').style.display = 'block';
                document.querySelector('a[href="/shop.html"]').style.color = 'var(--text-primary)';
                document.getElementById('adoptLink').style.color = 'var(--primary)';
                loadAdoptionPets();
            }

            function loadAdoptionPets() {
                fetch('/api/adoption/list')
                    .then(res => res.json())
                    .then(data => {
                        const grid = document.getElementById('adoptionGrid');
                        if (data.length === 0) {
                            grid.innerHTML = '<p class="text-muted" style="grid-column:1/-1; text-align:center;">No pets available for adoption right now.</p>';
                            return;
                        }
                        grid.innerHTML = data.map(p => {
                            const safeName = p.name.replace(/'/g, "\\'");
                            return `
                        <div class="card">
                            <div style="height:200px; background:#f3f4f6; border-radius:0.5rem; margin-bottom:1rem; overflow:hidden; display:flex; align-items:center; justify-content:center;">
                                ${p.image ? `<img src="${p.image}" style="width:100%; height:100%; object-fit:cover;" onerror="this.src='https://via.placeholder.com/300x200?text=No+Image'">` : '<span style="font-size:3rem; color:var(--text-muted);"><i class="fa-solid fa-paw"></i></span>'}
                            </div>
                            <div style="display:flex; justify-content:space-between; align-items:start; margin-bottom:0.5rem;">
                                <h3 style="margin:0; font-size:1.1rem;">${p.name}</h3>
                                <span class="badge badge-success">Adopt Me</span>
                            </div>
                            <p class="text-muted mb-2" style="font-size:0.9rem;">${p.category}</p>
                            <p class="text-muted mb-3" style="font-size:0.9rem; height:40px; overflow:hidden;">${p.desc}</p>
                            <button type="button" onclick="openAdoptionModal(${p.id}, '${safeName}')" class="btn-primary" style="width:100%">Apply for Adoption</button>
                        </div>
                    `}).join('');
                    });
            }

            function openAdoptionModal(id, name) {
                document.getElementById('adoptPetId').value = id;
                document.getElementById('adoptPetName').textContent = `Applying for: ${name}`;
                document.getElementById('adoptionModal').classList.add('active');
            }

            function closeAdoptionModal() {
                document.getElementById('adoptionModal').classList.remove('active');
            }

            function submitAdoption(e) {
                e.preventDefault();
                const formData = new FormData(e.target);
                const data = Object.fromEntries(formData.entries());

                fetch('/api/adoption/request', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                })
                    .then(res => res.json())
                    .then(res => {
                        if (res.success) {
                            alert('Application submitted successfully! We will contact you soon.');
                            closeAdoptionModal();
                            e.target.reset();
                        } else {
                            alert('Error: ' + res.message);
                        }
                    });
            }
        </script>
</body>

</html>
