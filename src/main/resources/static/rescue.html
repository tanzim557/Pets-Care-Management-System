<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rescue Dashboard - Pets Care</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .user-highlight {
            background: linear-gradient(135deg, #fff1f2, #ffe4e6);
            padding: 0.5rem 1.25rem;
            border-radius: 999px;
            box-shadow: 0 2px 10px rgba(225, 29, 72, 0.1);
            border: 1px solid rgba(225, 29, 72, 0.15);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .user-highlight .name-text {
            background: linear-gradient(90deg, #e11d48, #f43f5e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
            font-size: 1.1rem;
        }
    </style>
</head>

<body>
    <div class="admin-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo"><i class="fa-solid fa-truck-medical"></i> Rescue Team</div>
            </div>
            <nav class="sidebar-nav">
                <button class="nav-item active" onclick="showSection('active')"><i
                        class="fa-solid fa-house-medical-circle-exclamation"></i> Active Missions</button>
                <button class="nav-item" onclick="showSection('history')"><i class="fa-solid fa-clock-rotate-left"></i>
                    Mission History</button>
                <div style="flex:1"></div>
                <a href="/logout" class="nav-item" style="color: var(--danger);"><i
                        class="fa-solid fa-right-from-bracket"></i> Logout</a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Active Missions -->
            <div id="active" class="section active">
                <div class="header-bar" style="display: flex; justify-content: space-between; align-items: center;">
                    <div style="display: flex; align-items: center; gap: 1rem;">
                        <h1 class="page-title">Active Rescue Missions</h1>
                        <button onclick="loadMissions()" class="btn-login" style="padding: 0.5rem 1rem;"><i class="fa-solid fa-rotate-right"></i> Refresh</button>
                    </div>
                    <div class="user-info user-highlight">
                        <i class="fa-solid fa-truck-medical" style="color: #e11d48;"></i>
                        <span class="rescueNameDisplay name-text">Rescue Team</span> 
                        <span style="color: #fda4af; margin: 0 4px;">|</span>
                        <span class="badge badge-danger">Rescue</span>
                    </div>
                </div>
                <div class="services" id="activeGrid" style="padding:0;">
                    <!-- Missions go here -->
                </div>
            </div>

            <!-- History -->
            <div id="history" class="section" style="display:none;">
                <div class="header-bar" style="display: flex; justify-content: space-between; align-items: center;">
                    <h1 class="page-title">Mission History</h1>
                    <div class="user-info user-highlight">
                        <i class="fa-solid fa-truck-medical" style="color: #e11d48;"></i>
                        <span class="rescueNameDisplay name-text">Rescue Team</span> 
                        <span style="color: #fda4af; margin: 0 4px;">|</span>
                        <span class="badge badge-danger">Rescue</span>
                    </div>
                </div>
                <div class="services" id="historyGrid" style="padding:0;">
                    <!-- History goes here -->
                </div>
            </div>
        </main>
    </div>

    <script>
        // Initial Load
        loadMissions();
        setInterval(loadMissions, 30000); // Auto refresh every 30s

        function showSection(id) {
            document.querySelectorAll('.section').forEach(el => el.style.display = 'none');
            document.getElementById(id).style.display = 'block';

            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            event.target.classList.add('active');
        }

        function getCookie(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) return parts.pop().split(';').shift();
            return null;
        }

        const username = getCookie('user');
        const rawFullName = getCookie('fullName');
        
        let displayName = username || 'Rescue Team';
        if(rawFullName) {
            displayName = decodeURIComponent(rawFullName.replace(/\+/g, ' '));
        }

        document.querySelectorAll('.rescueNameDisplay').forEach(el => el.textContent = displayName);

        function loadMissions() {
            const rescueId = getCookie('rescueId');
            if (!rescueId) {
                console.error("No rescueId found");
                return;
            }

            fetch(`/api/rescue/${rescueId}/missions`)
                .then(res => res.json())
                .then(data => {
                    const activeGrid = document.getElementById('activeGrid');
                    const historyGrid = document.getElementById('historyGrid');

                    const active = data.filter(m => m.status === 'RescueRequested');
                    const history = data.filter(m => m.status !== 'RescueRequested');

                    if (active.length === 0) {
                        activeGrid.innerHTML = '<p class="text-muted">No active rescue missions.</p>';
                    } else {
                        activeGrid.innerHTML = active.map(m => `
                            <div class="card">
                                <span class="badge badge-danger mb-2">URGENT</span>
                                <h3>${m.category} Emergency</h3>
                                <p class="mb-1"><i class="fa-solid fa-location-dot"></i> ${m.area} - ${m.location}</p>
                                <p class="mb-1"><i class="fa-solid fa-phone"></i> ${m.phone}</p>
                                <p class="mb-2 p-2" style="background:var(--bg-light); border-radius:0.5rem;">${m.desc}</p>
                                <button onclick="completeRescue(${m.id})" class="btn-primary" style="width:100%; background:var(--secondary);"><i class="fa-solid fa-check-circle"></i> Mark as Rescued</button>
                            </div>
                        `).join('');
                    }

                    if (history.length === 0) {
                        historyGrid.innerHTML = '<p class="text-muted">No mission history.</p>';
                    } else {
                        historyGrid.innerHTML = history.map(m => `
                            <div class="card" style="opacity:0.8;">
                                <div style="display:flex; justify-content:space-between;">
                                    <h3>${m.category}</h3>
                                    <div class="badge badge-success" style="background-color: var(--secondary);">Completed</div>
                                </div>
                                <p class="mb-1"><i class="fa-solid fa-location-dot"></i> ${m.area}</p>
                                <p class="text-muted" style="font-size:0.9rem;">${m.desc}</p>
                                <p style="font-size:0.8rem; margin-top:5px;"><strong>Status:</strong> ${m.status}</p>
                            </div>
                        `).join('');
                    }
                });
        }

        function completeRescue(id) {
            if (!confirm('Confirm animal has been rescued and brought to hospital?')) return;

            fetch(`/api/rescue/complete/${id}`, { method: 'POST' })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        alert('Mission completed! Good job.');
                        loadMissions();
                    }
                });
        }
    </script>
</body>

</html>
