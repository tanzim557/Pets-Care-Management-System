spring.application.name=pets-care-system
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/petscare?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root1234}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
server.port=${PORT:8081}

# SMS Configuration (can be overridden via environment variables SMS_API_KEY and SMS_SENDER_ID)
# For Docker: Set these as environment variables when running the container

# ===== CLEAN PROFESSIONAL LOGGING =====
# Only show application-level logs (clean output)
logging.level.root=WARN
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN

# Show our custom filter and SMS service logs
logging.level.com.petscare.config.RequestResponseLoggingFilter=INFO
logging.level.com.petscare.utils.SMSService=INFO
logging.level.com.petscare=INFO

# Clean console output format
logging.pattern.console=%d{HH:mm:ss.SSS} %msg%n
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
